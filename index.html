<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#fffaf0">
    <title>Let's go lotto!</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif;
        background: #fffaf0;
        color: #23364a;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --coral: #ed665d;
        --purple: #80649a;
        --teal: #78aaa6;
        --green: #a9bd55;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          radial-gradient(ellipse at 12% 18%, #ffe8c7 0 2px, transparent 3px),
          radial-gradient(ellipse at 86% 76%, #d7eee6 0 3px, transparent 4px),
          #fffaf0;
        background-size: 46px 46px, 58px 58px, auto;
      }

      main {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 18px 34px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 4px;
        color: #77628c;
        font-size: clamp(0.75rem, 2vw, 0.9rem);
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #29445a;
        font-size: clamp(2.2rem, 7vw, 4rem);
        font-weight: 900;
        letter-spacing: -0.055em;
        line-height: 1;
      }

      h1 span {
        color: var(--coral);
      }

      .instruction {
        margin: 12px 0 22px;
        color: #637487;
        font-size: clamp(0.95rem, 2.8vw, 1.1rem);
      }

      .wheel-wrap {
        position: relative;
        width: min(78vw, 570px);
        min-width: 270px;
        aspect-ratio: 1;
        margin: 0 auto;
        filter: drop-shadow(0 13px 10px #30445a30);
      }

      .spin-button {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        padding: 0;
        overflow: visible;
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }

      .spin-button:focus-visible {
        outline: 4px solid #304b62;
        outline-offset: 7px;
      }

      .spin-button:disabled {
        cursor: wait;
      }

      .wheel-art {
        display: block;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      #spinningArrow {
        transform: rotate(0deg);
        transform-origin: 400px 400px;
        transition: transform 5.2s cubic-bezier(0.12, 0.72, 0.08, 1);
      }

      .spin-button:hover #spinningArrow {
        filter: brightness(1.025);
      }

      .result {
        min-height: 3.2em;
        margin: 18px 0 0;
        color: #687889;
        font-size: 1rem;
        font-weight: 700;
      }

      .result strong {
        display: block;
        color: #29445a;
        font-size: clamp(1.35rem, 4vw, 1.7rem);
      }

      .result-color {
        display: block;
        margin-top: 3px;
        color: #536779;
        font-size: 1.05rem;
        font-weight: 800;
      }

      .color-swatch {
        display: inline-block;
        width: 0.75em;
        height: 0.75em;
        margin-right: 0.4em;
        border: 2px solid #fffaf0;
        border-radius: 50%;
        box-shadow: 0 0 0 1px #344c6080;
        vertical-align: -0.02em;
      }

      @media (max-height: 760px) {
        main {
          padding-top: 18px;
          padding-bottom: 20px;
        }

        .instruction {
          margin-bottom: 14px;
        }

        .wheel-wrap {
          width: min(68vh, 500px, 78vw);
        }

        .result {
          margin-top: 10px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #spinningArrow {
          transition-duration: 1ms;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Ready, set, spin!</p>
      <h1>Let's go <span>lotto!</span></h1>
      <p class="instruction">Tap the spinner and see where it lands</p>

      <div class="wheel-wrap">
        <button class="spin-button" id="spinButton" type="button" aria-label="Spin the Let's go lotto wheel">
          <svg class="wheel-art" viewBox="0 0 800 800" role="img" aria-label="Eight colorful picture spaces: rocket, digger, car, motorbike, helicopter, boat, train, and ambulance">
            <defs>
              <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
                <circle cx="5" cy="5" r="3" fill="#ffffff" opacity=".29"/>
                <circle cx="19" cy="18" r="2" fill="#6887a0" opacity=".12"/>
              </pattern>
            </defs>
            <circle cx="400" cy="400" r="380" fill="#fffdf7"/>
            <circle cx="400" cy="400" r="376" fill="#7892a7" stroke="#fffdf7" stroke-width="5"/>
            <g id="rimSegments"></g>
            <circle cx="400" cy="400" r="312" fill="#a9c2d4" stroke="#fffdf7" stroke-width="5"/>
            <g id="wheelSectors"></g>
            <g id="vehiclePictures"></g>
            <g id="vehicleLabels"></g>
            <circle cx="400" cy="400" r="376" fill="none" stroke="#fffdf7" stroke-width="7"/>
            <circle cx="400" cy="400" r="65" fill="#fffaf0" stroke="#788fa2" stroke-width="7"/>
            <g id="spinningArrow" aria-hidden="true">
              <path d="M400 326l-42 57h27v72h30v-72h27z" fill="#e85f54" stroke="#fffaf0" stroke-width="7" stroke-linejoin="round"/>
              <path d="M400 343l-22 31h44z" fill="#ff9381" opacity=".8"/>
            </g>
          </svg>
        </button>
      </div>

      <p class="result" id="result" aria-live="polite">Give it a spin!<strong>Where will you land?</strong></p>
    </main>

    <script>
      const colors = [
        { name: "Red", fill: "#ed665d" },
        { name: "Purple", fill: "#80649a" },
        { name: "Teal", fill: "#78aaa6" },
        { name: "Green", fill: "#a9bd55" }
      ];
      const rim = document.getElementById("rimSegments");
      const sectors = document.getElementById("wheelSectors");
      const pictures = document.getElementById("vehiclePictures");
      const labels = document.getElementById("vehicleLabels");
      const arrow = document.getElementById("spinningArrow");
      const spinButton = document.getElementById("spinButton");
      const result = document.getElementById("result");
      const center = 400;
      const items = [
        { name: "Rocket", art: `<path d="M0-55Q28-33 25 8L0 38-25 8Q-28-33 0-55Z" fill="#f2b83f" stroke="#76556c" stroke-width="4"/><path d="M-21 7H21L25 17 0 43-25 17Z" fill="#c94c50"/><path d="M-22-1-42 20l5-30 14-7m45 16 20 21-5-30-14-7M-10 37-3 52 4 41" fill="#ed665d" stroke="#76556c" stroke-width="4" stroke-linejoin="round"/><circle cy="-17" r="10" fill="#e0f3e7" stroke="#80649a" stroke-width="5"/><path d="M-10-44 0-61 7-45 21-52 12-33" fill="#a9bd55" stroke="#76556c" stroke-width="3"/><path d="M-12 11H12" stroke="#fff1d2" stroke-width="4"/>` },
        { name: "Digger", art: `<path d="M-39 19h76v14h-76z" fill="#55475d" stroke="#403d52" stroke-width="4"/><path d="M-25 21h49v8h-49z" fill="#f1b841"/><path d="M-18 9h44v13h-44z" fill="#e7a934" stroke="#735d62" stroke-width="3"/><path d="M-17 7v-30h27l16 30z" fill="#edb943" stroke="#735d62" stroke-width="4" stroke-linejoin="round"/><path d="M-10-20H3L15-1H-10z" fill="#cfe5df" stroke="#735d62" stroke-width="3"/><path d="M-1-23-15-39-29-49m-4 3-10-7 7-13 13 8 1 12m7 7 18 18 26-23 15 11-29 32-32-17" fill="none" stroke="#e5a82f" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="m-39-52-7-7 4 14 8-2" fill="#ed665d" stroke="#735d62" stroke-width="3"/><circle cx="-25" cy="27" r="3" fill="#fff0bd"/><circle cx="-12" cy="27" r="3" fill="#fff0bd"/><circle cx="1" cy="27" r="3" fill="#fff0bd"/>` },
        { name: "Car", art: `<path d="M-47 7-36-14Q-32-23-20-23H11Q22-23 30-10L43 5l8 5v17h-98V10z" fill="#548956" stroke="#476778" stroke-width="4" stroke-linejoin="round"/><path d="M-27-15h20v19h-35zm27 0h12q7 1 13 19H0z" fill="#d9f0e9" stroke="#476778" stroke-width="3"/><path d="M-39 11h81" stroke="#a9bd55" stroke-width="6"/><circle cx="-27" cy="27" r="11" fill="#53485e"/><circle cx="29" cy="27" r="11" fill="#53485e"/><circle cx="-27" cy="27" r="4" fill="#fff0bd"/><circle cx="29" cy="27" r="4" fill="#fff0bd"/><circle cx="8" cy="-3" r="8" fill="#f3c94c"/><path d="M2-1q6 4 12 0" fill="none" stroke="#76556c" stroke-width="2"/>` },
        { name: "Motorbike", art: `<circle cx="-30" cy="23" r="14" fill="#453e50" stroke="#282f43" stroke-width="3"/><circle cx="31" cy="23" r="14" fill="#453e50" stroke="#282f43" stroke-width="3"/><circle cx="-30" cy="23" r="6" fill="#d7e4dc"/><circle cx="31" cy="23" r="6" fill="#d7e4dc"/><path d="M-30 23-11 0 10 3 31 23H-30L-11 0 4 23M7-1 15-21h16m-9 0 10 8" fill="none" stroke="#b53f5c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M-5-23q4-11 14-10 12 2 15 13l-6 10-18-2z" fill="#f0b546" stroke="#76556c" stroke-width="3"/><circle cx="7" cy="-36" r="8" fill="#f6d395" stroke="#76556c" stroke-width="3"/><path d="M-5-16-17-4l14 9L8-10m8-11 13 15" fill="none" stroke="#80649a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M-1 4h12" stroke="#f2d794" stroke-width="4"/>` },
        { name: "Helicopter", art: `<path d="M-32-8q0-21 25-21H9q20 0 23 22L19 7H-22z" fill="#c6424e" stroke="#744e67" stroke-width="4" stroke-linejoin="round"/><path d="M-12-24H7q12 0 15 13H-12z" fill="#cfe9e3" stroke="#744e67" stroke-width="3"/><path d="M32-7 52 5 31 11m-49 10h38M-1-29v-8m-39-6h80" fill="none" stroke="#744e67" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14 12 2 20 17 8" fill="none" stroke="#c6424e" stroke-width="8" stroke-linecap="round"/><path d="M-10 20v8m20-8v8" stroke="#80649a" stroke-width="4"/><circle cx="-1" cy="-5" r="9" fill="#9abb76" stroke="#527263" stroke-width="3"/><path d="M-6-4q5 4 10 0" fill="none" stroke="#527263" stroke-width="2"/>` },
        { name: "Boat", art: `<path d="M-45 8h90L29 31q-29 17-58 0z" fill="#e5a934" stroke="#76556c" stroke-width="4" stroke-linejoin="round"/><path d="M-44 8h88" stroke="#c44c51" stroke-width="7"/><path d="M-21 4v-34h39q11 0 11 12V4z" fill="#fff3db" stroke="#76556c" stroke-width="4"/><path d="M-14-23h15v14h-15zm22 0h13v14H8z" fill="#9fc9c8" stroke="#76556c" stroke-width="3"/><path d="M-18 3V-2h31V3" fill="#80649a"/><circle cx="-27" cy="38" r="10" fill="#fff3db"/><path d="M-33 30l-2-11 8 6m5 5 3-11-9 5" fill="#fff3db" stroke="#76556c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="-29" cy="37" r="1.5" fill="#76556c"/><path d="M-20 41q4 4 8 0" fill="none" stroke="#c44c51" stroke-width="2"/><path d="M-37 47q8-5 16 0t16 0" fill="none" stroke="#78aaa6" stroke-width="4" stroke-linecap="round"/>` },
        { name: "Train", art: `<path d="M-42-9h62v42h-62z" fill="#4d8751" stroke="#465b4d" stroke-width="4"/><path d="M-29-29h29v20h-29z" fill="#cfe9e3" stroke="#465b4d" stroke-width="4"/><path d="M-34-34h41v6h-41z" fill="#80649a"/><path d="M-5-38h17v10H-5z" fill="#c6424e"/><path d="M20 6h21v24H20z" fill="#c6424e" stroke="#465b4d" stroke-width="4"/><path d="M20 12h21M20 20h21" stroke="#f1bd4c" stroke-width="3"/><path d="M-38 0h54M-20-7v38" stroke="#f1bd4c" stroke-width="4"/><circle cx="-27" cy="35" r="10" fill="#51465c"/><circle cx="5" cy="35" r="10" fill="#51465c"/><circle cx="-27" cy="35" r="4" fill="#f1bd4c"/><circle cx="5" cy="35" r="4" fill="#f1bd4c"/><path d="M-45 32h-8l13 18 13-18" fill="#80649a" stroke="#51465c" stroke-width="3"/><circle cx="-28" cy="-17" r="6" fill="#a9bd55"/><circle cx="-13" cy="-17" r="6" fill="#a9bd55"/>` },
        { name: "Ambulance", art: `<path d="M-43-23h55v53h-55z" fill="#fff3df" stroke="#718496" stroke-width="4"/><path d="M12-11h19l16 18v23H12z" fill="#fff3df" stroke="#718496" stroke-width="4" stroke-linejoin="round"/><path d="M18-5h11l11 12H18z" fill="#b9dddc" stroke="#718496" stroke-width="3"/><path d="M-43 18h55m-14-41v53" stroke="#c9424d" stroke-width="5"/><path d="M-26-12h10v8h8V6h-8v8h-10V6h-8V-4h8z" fill="#c9424d"/><path d="M-23-34h15v11h-15z" fill="#ed665d"/><circle cx="-26" cy="31" r="9" fill="#50475c"/><circle cx="30" cy="31" r="9" fill="#50475c"/><circle cx="-26" cy="31" r="4" fill="#fff0bd"/><circle cx="30" cy="31" r="4" fill="#fff0bd"/>` }
      ];

      function point(radius, angle) {
        const radians = angle * Math.PI / 180;
        return [center + radius * Math.cos(radians), center + radius * Math.sin(radians)];
      }

      function ringSegment(innerRadius, outerRadius, startAngle, endAngle) {
        const [outerStartX, outerStartY] = point(outerRadius, startAngle);
        const [outerEndX, outerEndY] = point(outerRadius, endAngle);
        const [innerEndX, innerEndY] = point(innerRadius, endAngle);
        const [innerStartX, innerStartY] = point(innerRadius, startAngle);
        return `M${outerStartX} ${outerStartY} A${outerRadius} ${outerRadius} 0 0 1 ${outerEndX} ${outerEndY} L${innerEndX} ${innerEndY} A${innerRadius} ${innerRadius} 0 0 0 ${innerStartX} ${innerStartY}Z`;
      }

      for (let i = 0; i < items.length; i += 1) {
        for (let colorIndex = 0; colorIndex < colors.length; colorIndex += 1) {
          const start = -112.5 + i * 45 + colorIndex * 11.25 + 0.65;
          const end = -112.5 + i * 45 + (colorIndex + 1) * 11.25 - 0.65;
          rim.insertAdjacentHTML("beforeend", `<path d="${ringSegment(315, 371, start, end)}" fill="${colors[colorIndex].fill}"/>`);
        }
      }

      for (let i = 0; i < items.length; i += 1) {
        const start = -112.5 + i * 45;
        const end = start + 45;
        const angle = -90 + i * 45;
        const [imageX, imageY] = point(174, angle);
        const [labelX, labelY] = point(258, angle);
        let labelAngle = angle + 90;
        if (labelAngle > 90) labelAngle -= 180;
        if (labelAngle < -90) labelAngle += 180;
        sectors.insertAdjacentHTML("beforeend", `<path d="${ringSegment(0, 312, start, end)}" fill="url(#dots)" stroke="#fffaf0" stroke-width="4"/>`);
        pictures.insertAdjacentHTML("beforeend", `<g transform="translate(${imageX} ${imageY})">${items[i].art}</g>`);
        labels.insertAdjacentHTML("beforeend", `<g transform="translate(${labelX} ${labelY}) rotate(${labelAngle})"><text text-anchor="middle" dominant-baseline="middle" font-family="Trebuchet MS, Arial, sans-serif" font-size="29" font-weight="800" fill="#344c60" stroke="#e1edf0" stroke-width="6" paint-order="stroke">${items[i].name}</text></g>`);
      }

      let currentAngle = 0;
      let isSpinning = false;

      spinButton.addEventListener("click", () => {
        if (isSpinning) return;

        isSpinning = true;
        spinButton.disabled = true;
        result.textContent = "Spinning...";

        const selected = Math.floor(Math.random() * items.length);
        const selectedColor = Math.floor(Math.random() * colors.length);
        const fullTurns = 5 + Math.floor(Math.random() * 3);
        const targetAngle = ((-16.875 + selected * 45 + selectedColor * 11.25) % 360 + 360) % 360;
        const angleToSelection = (targetAngle - currentAngle % 360 + 360) % 360;
        currentAngle += fullTurns * 360 + angleToSelection;

        const finishSpin = () => {
          if (!isSpinning) return;
          window.clearTimeout(fallbackTimer);
          arrow.removeEventListener("transitionend", onSpinEnd);
          isSpinning = false;
          spinButton.disabled = false;
          result.innerHTML = `It landed on...<strong>${items[selected].name}</strong><span class="result-color"><span class="color-swatch" style="background-color:${colors[selectedColor].fill}"></span>${colors[selectedColor].name}</span>`;
        };
        const onSpinEnd = (event) => {
          if (event.propertyName !== "transform") return;
          finishSpin();
        };
        const fallbackTimer = window.setTimeout(
          finishSpin,
          window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 50 : 5600
        );
        arrow.addEventListener("transitionend", onSpinEnd, { once: true });
        arrow.style.transform = `rotate(${currentAngle}deg)`;
      });
    </script>
  </body>
</html>
